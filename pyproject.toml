[project]
name = "saturday"
version = "0.1.0"
description = "Agente de atendimento e portabilidade INSS → C6"
readme = "README.md"
authors = [
    { name = "Carlos Eduardo Ferreira Fernandes", email = "ar7lpn@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "uvicorn>=0.54.0",
]

[project.scripts]
saturday = "saturday:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
