[project]
name = "saturday"
version = "0.1.0"
description = "Agente de atendimento e portabilidade INSS → C6"
readme = "README.md"
authors = [
    { name = "Carlos Eduardo Ferreira Fernandes", email = "ar7lpn@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
saturday = "saturday:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/saturday"]
mypy_path = "src"

[tool.pytest.ini_options]
filterwarnings = ["error", "ignore::DeprecationWarning:langsmith.*"]
markers = ["jev: chama o Jev de verdade; pulado sem SATURDAY_OPENROUTER_API_KEY"]
