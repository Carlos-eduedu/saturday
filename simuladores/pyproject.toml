[project]
name = "saturday-simuladores"
version = "0.1.0"
description = "Simuladores dos parceiros (Meta, Granatech) para desenvolvimento e testes"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["."]
# Cada simulador tem seu `app.py`: os módulos viram `meta.app` e `granatech.app`.
explicit_package_bases = true
