# Alembic roda de dentro do projeto:
#   cd apps/core && uv run alembic upgrade head
# A URL vem de SATURDAY_DATABASE_URL (ver migrations/env.py), não daqui: o
# mesmo arquivo serve para dev, homolog e produção.

[alembic]
script_location = %(here)s/migrations
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
