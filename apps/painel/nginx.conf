# `$uri` em vez de `$request`: a query (busca por telefone) não vai para o log.
log_format painel '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log painel;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # O Traefik do Dokploy não comprime: sem isto o JS ia cru (580 KB em vez
    # de ~190 KB). Só os arquivos do painel; o proxy da API fica de fora
    # (gzip_proxied off), para não comprimir resposta com dado de sessão.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    location /admin/eventos {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE: nada de buffer, e a conexão fica aberta.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    # Arquivos do build têm hash no nome: o mesmo nome nunca muda de conteúdo.
    # `add_header` aqui anula os do server: os três de segurança se repetem.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # O index.html aponta para o bundle do deploy: sempre conferido, senão o
    # navegador segue no bundle velho depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri /index.html;
    }
}
