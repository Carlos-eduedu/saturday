# Forma de deploy (Dokploy): sem `ports`, sem `container_name`, só volumes
# nomeados, limites de recurso e healthcheck. Os ajustes de desenvolvimento
# local ficam em `compose.override.yaml`, carregado automaticamente.
#
# `postgres` e `minio` são opcionais: sobem com
# `COMPOSE_PROFILES=postgres,minio` no `.env`. Sem eles, `SATURDAY_DATABASE_URL`
# e `SATURDAY_S3_*` precisam apontar para serviços externos, e a aplicação
# valida essa combinação na subida.
name: saturday

x-app: &app
  # Tag por stack: no Dokploy os três ambientes dividem o servidor, e uma tag
  # fixa deixaria o build de um ambiente trocar a imagem do outro.
  image: saturday-api:${SATURDAY_IMAGEM_TAG:-local}
  build:
    context: .
    dockerfile: apps/core/Dockerfile
  # `.env.local` é opcional: guarda o que muda por máquina (URL do Postgres,
  # endpoint do MinIO) sem mexer no `.env` compartilhado.
  env_file:
    - .env
    - path: .env.local
      required: false

services:
  # Roda as migrações e termina. API e worker só sobem se isso der certo.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    # Roda e termina: healthcheck de serviço de vida curta só gera ruído.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    mem_limit: 512m
    cpus: 0.5

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "saturday-health", "api"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  # Entrega o outbox. Ouvir o canal é trabalho dele, não da API.
  worker:
    <<: *app
    command: ["saturday-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # O worker não serve HTTP: saúde é banco acessível + laço girando.
    healthcheck:
      test: ["CMD", "saturday-health", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  # Painel da equipe: nginx com o build do Vite e proxy de `/admin` para a API,
  # na mesma origem. É este serviço que o domínio do painel expõe.
  painel:
    image: saturday-painel:${SATURDAY_IMAGEM_TAG:-local}
    build:
      context: apps/painel
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  postgres:
    # pgvector: a base de conhecimento guarda embeddings (decisão 0017).
    image: pgvector/pgvector:pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: saturday
      POSTGRES_USER: saturday
      POSTGRES_PASSWORD: saturday
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saturday -d saturday"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SATURDAY_S3_ACCESS_KEY:-saturday}
      MINIO_ROOT_PASSWORD: ${SATURDAY_S3_SECRET_KEY:-saturday123}
    volumes:
      - minio_dados:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  # Cria o bucket uma vez e termina. O app não administra infraestrutura.
  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${SATURDAY_S3_ACCESS_KEY:-saturday}"
        "$${SATURDAY_S3_SECRET_KEY:-saturday123}"; do sleep 1; done;
        mc mb --ignore-existing local/"$${SATURDAY_S3_BUCKET:-saturday}";
    environment:
      SATURDAY_S3_ACCESS_KEY: ${SATURDAY_S3_ACCESS_KEY:-saturday}
      SATURDAY_S3_SECRET_KEY: ${SATURDAY_S3_SECRET_KEY:-saturday123}
      SATURDAY_S3_BUCKET: ${SATURDAY_S3_BUCKET:-saturday}
    restart: "no"
    mem_limit: 128m
    cpus: 0.25

  # Evolution API (WhatsApp Web, não oficial; docs/decisoes/0009). Opcional:
  # sobe com `evolution` em COMPOSE_PROFILES. Fica só na rede interna, sem
  # domínio: o Saturday chama `http://evolution:8080` e ela chama o webhook em
  # `http://api:8000/webhooks/evolution`. Postgres e Redis próprios.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["evolution"]
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${SATURDAY_EVOLUTION_API_KEY:-}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_SENHA:-}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: saturday
      # O download de mídia procura a mensagem na base da Evolution.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instancias:/evolution/instances
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  evolution-postgres:
    image: postgres:17-alpine
    profiles: ["evolution"]
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_SENHA:-}
    volumes:
      - evolution_postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  evolution-redis:
    image: redis:7-alpine
    profiles: ["evolution"]
    volumes:
      - evolution_redis_dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres_dados:
  minio_dados:
  evolution_instancias:
  evolution_postgres_dados:
  evolution_redis_dados:
