name: testes

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          # O lock do workspace vive na raiz, não em cada membro.
          cache-dependency-glob: uv.lock

      - name: Instalar dependências
        run: uv sync --locked

      - name: Formatação
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest

  simuladores:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simuladores
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Instalar dependências
        run: uv sync --locked

      - name: Formatação
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Tipos
        run: uv run mypy

  painel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/painel/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos e build
        run: npm run build
