name: testes

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core
    # Banco descartável: sem ele os testes de Postgres (trava, outbox, jornadas
    # CLT) são pulados. Precisa do pgvector (decisão 0017).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: saturday
          POSTGRES_PASSWORD: saturday
          POSTGRES_DB: saturday_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saturday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          # O lock do workspace vive na raiz, não em cada membro.
          cache-dependency-glob: uv.lock

      - name: Instalar dependências
        run: uv sync --locked

      - name: Formatação
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy

      - name: Testes
        env:
          SATURDAY_TEST_DATABASE_URL: postgresql://saturday:saturday@127.0.0.1:5432/saturday_test
        run: uv run pytest

  simuladores:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simuladores
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Instalar dependências
        run: uv sync --locked

      - name: Formatação
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Tipos
        run: uv run mypy

  painel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/painel/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos e build
        run: npm run build

      - name: Testes
        run: npm run teste
