# Ajustes de desenvolvimento local. O Docker Compose carrega este arquivo
# automaticamente junto com `compose.yaml`.
#
# Publica as portas que o desenvolvedor usa por fora dos containers (API,
# Postgres para rodar `pytest`, S3 local e os simuladores da Meta, da
# Granatech, da Evolution, do iCred e do C6) e aponta o canal do WhatsApp e o
# cliente da Granatech para os simuladores em vez dos parceiros de verdade.
services:
  api:
    ports:
      - "8000:8000"
    environment:
      SATURDAY_WHATSAPP_GRAPH_URL: http://meta:8100
      SATURDAY_GRANATECH_BASE_URL: http://granatech:8200
      SATURDAY_EVOLUTION_URL: http://evolution-sim:8300
      SATURDAY_ICRED_BASE_URL: http://icred:8400

  worker:
    environment:
      SATURDAY_WHATSAPP_GRAPH_URL: http://meta:8100
      SATURDAY_GRANATECH_BASE_URL: http://granatech:8200
      SATURDAY_EVOLUTION_URL: http://evolution-sim:8300
      SATURDAY_ICRED_BASE_URL: http://icred:8400

  painel:
    ports:
      - "5173:80"

  postgres:
    ports:
      - "5432:5432"

  # Na 9000 do host, como antes: a 9090 é do S3 do `infra/painel_local.sh`.
  s3:
    ports:
      - "9000:9090"

  # Simulador da WhatsApp Cloud API. Roda na mesma imagem da API (que já tem
  # fastapi e uvicorn) com o código montado do repositório: só existe em dev.
  meta:
    image: saturday-api:${SATURDAY_IMAGEM_TAG:-local}
    # Herda o healthcheck da imagem, mas serve na 8100: aponta para ela.
    healthcheck:
      test: ["CMD", "saturday-health", "api"]
      interval: 30s
      timeout: 5s
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    working_dir: /app
    volumes:
      - ./simuladores:/simuladores:ro
    command:
      - uvicorn
      - app:app
      - --app-dir
      - /simuladores/meta
      - --host
      - 0.0.0.0
      - --port
      - "8100"
    environment:
      SIMULADOR_SATURDAY_URL: http://api:8000
      SIMULADOR_BASE_URL: http://meta:8100
      SATURDAY_WHATSAPP_APP_SECRET: ${SATURDAY_WHATSAPP_APP_SECRET:-segredo}
      SIMULADOR_WHATSAPP_NUMERO: "11987654321"
      SIMULADOR_PHONE_NUMBER_ID: "100000000000001"
      SATURDAY_HEALTH_URL: http://127.0.0.1:8100/admin/enviadas
    ports:
      - "8100:8100"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # Simulador da Granatech, no mesmo molde do da Meta. A chave do cliente
  # precisa ser a mesma do simulador.
  granatech:
    image: saturday-api:${SATURDAY_IMAGEM_TAG:-local}
    healthcheck:
      test: ["CMD", "saturday-health", "api"]
      interval: 30s
      timeout: 5s
    working_dir: /app
    volumes:
      - ./simuladores:/simuladores:ro
    command:
      - uvicorn
      - app:app
      - --app-dir
      - /simuladores/granatech
      - --host
      - 0.0.0.0
      - --port
      - "8200"
    environment:
      SIMULADOR_SATURDAY_URL: http://api:8000
      SIMULADOR_GRANATECH_CHAVE: ${SATURDAY_GRANATECH_CHAVE_API:-chave-do-simulador}
      SATURDAY_GRANATECH_WEBHOOK_TOKEN: ${SATURDAY_GRANATECH_WEBHOOK_TOKEN:-token-do-simulador}
      SATURDAY_HEALTH_URL: http://127.0.0.1:8200/admin/estado
    ports:
      - "8200:8200"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # Simulador da Evolution API, no mesmo molde. A chave e o token precisam ser
  # os mesmos do Saturday; as instâncias são criadas pela tela Canais.
  evolution-sim:
    image: saturday-api:${SATURDAY_IMAGEM_TAG:-local}
    healthcheck:
      test: ["CMD", "saturday-health", "api"]
      interval: 30s
      timeout: 5s
    working_dir: /app
    volumes:
      - ./simuladores:/simuladores:ro
    command:
      - uvicorn
      - app:app
      - --app-dir
      - /simuladores/evolution
      - --host
      - 0.0.0.0
      - --port
      - "8300"
    environment:
      SIMULADOR_SATURDAY_URL: http://api:8000
      SATURDAY_EVOLUTION_API_KEY: ${SATURDAY_EVOLUTION_API_KEY:-chave-do-simulador}
      SATURDAY_EVOLUTION_WEBHOOK_TOKEN: ${SATURDAY_EVOLUTION_WEBHOOK_TOKEN:-token-do-simulador}
      SIMULADOR_EVOLUTION_INSTANCIA: mex-sim
      SATURDAY_HEALTH_URL: http://127.0.0.1:8300/admin/enviadas
    ports:
      - "8300:8300"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # Simulador do motor do iCred (decisão 0027), no mesmo molde. A consulta
  # conclui sozinha com o cenário abaixo; a chave e o segredo precisam ser os
  # mesmos do Saturday. O ramo só usa o iCred com SATURDAY_ICRED_ATIVO=true.
  icred:
    image: saturday-api:${SATURDAY_IMAGEM_TAG:-local}
    healthcheck:
      test: ["CMD", "saturday-health", "api"]
      interval: 30s
      timeout: 5s
    working_dir: /app
    volumes:
      - ./simuladores:/simuladores:ro
    command:
      - uvicorn
      - app:app
      - --app-dir
      - /simuladores/icred
      - --host
      - 0.0.0.0
      - --port
      - "8400"
    environment:
      SIMULADOR_SATURDAY_URL: http://api:8000
      SIMULADOR_ICRED_CHAVE: ${SATURDAY_ICRED_CHAVE_API:-chave-do-simulador-icred}
      SATURDAY_ICRED_WEBHOOK_SEGREDO: ${SATURDAY_ICRED_WEBHOOK_SEGREDO:-segredo-do-simulador-icred}
      SIMULADOR_ICRED_CENARIO: com_oferta
      SATURDAY_HEALTH_URL: http://127.0.0.1:8400/saude
    ports:
      - "8400:8400"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # Simulador do C6 Consignado (decisão 0026), no mesmo molde. Nada aponta para
  # ele sozinho: o C6 só entra com SATURDAY_C6_ATIVO=true e
  # SATURDAY_C6_BASE_URL=http://c6:8500 no `.env` (docs/c6.md). O usuário e a
  # senha precisam ser os mesmos do Saturday.
  c6:
    image: saturday-api:${SATURDAY_IMAGEM_TAG:-local}
    healthcheck:
      test: ["CMD", "saturday-health", "api"]
      interval: 30s
      timeout: 5s
    working_dir: /app
    volumes:
      - ./simuladores:/simuladores:ro
    command:
      - uvicorn
      - app:app
      - --app-dir
      - /simuladores/c6
      - --host
      - 0.0.0.0
      - --port
      - "8500"
    environment:
      SIMULADOR_C6_USUARIO: ${SATURDAY_C6_USUARIO:-usuario-do-simulador}
      SIMULADOR_C6_SENHA: ${SATURDAY_C6_SENHA:-senha-do-simulador}
      SATURDAY_HEALTH_URL: http://127.0.0.1:8500/saude
    ports:
      - "8500:8500"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
