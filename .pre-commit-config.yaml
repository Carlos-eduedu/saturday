# Os hooks rodam com `--directory apps/core` porque é lá que vivem o
# `pyproject.toml` (config de ruff e mypy), o `uv.lock` e o código.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --directory apps/core ruff format
        language: system
        files: ^apps/core/
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --directory apps/core ruff check --fix
        language: system
        files: ^apps/core/
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory apps/core mypy
        language: system
        files: ^apps/core/
        types: [python]
        pass_filenames: false
